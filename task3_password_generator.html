<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyforge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12151A;
    --surface: #1B1F26;
    --surface-2: #232833;
    --border: #2C323D;
    --text: #E9E9EA;
    --text-dim: #8D93A0;
    --accent: #5FD9C9;
    --weak: #E8664A;
    --mid: #E0B44A;
    --strong: #5FD9C9;
    --radius: 10px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 20% 100%, rgba(95,217,201,0.07), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
  }
  .app { width: 100%; max-width: 460px; }
  header { margin-bottom: 28px; }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    margin: 0 0 8px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--text-dim); font-size: 14.5px; margin: 0; line-height: 1.5; }

  .output {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin: 26px 0 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #passwordText {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 19px;
    word-break: break-all;
    letter-spacing: 0.02em;
  }
  .icon-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 8px;
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  .icon-btn svg { width: 17px; height: 17px; }

  .strength-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 26px;
  }
  .strength-bars {
    flex: 1;
    display: flex;
    gap: 4px;
  }
  .strength-bars span {
    height: 4px;
    flex: 1;
    border-radius: 2px;
    background: var(--border);
    transition: background 0.15s ease;
  }
  .strength-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .field { margin-bottom: 20px; }
  .field-label {
    display: flex;
    justify-content: space-between;
    font-size: 13.5px;
    margin-bottom: 10px;
    color: var(--text-dim);
  }
  .field-label span.val { color: var(--text); font-family: 'JetBrains Mono', monospace; }

  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    height: 4px;
  }

  .toggles {
    display: flex;
    flex-direction: column;
    gap: 2px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row label { font-size: 14px; cursor: pointer; }
  .toggle-row .example { color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 12px; }

  .switch {
    position: relative;
    width: 38px;
    height: 22px;
    flex: 0 0 38px;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider-track {
    position: absolute;
    inset: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: 0.15s ease;
  }
  .slider-track::before {
    content: "";
    position: absolute;
    width: 16px; height: 16px;
    left: 2px; top: 2px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: 0.15s ease;
  }
  .switch input:checked + .slider-track { background: rgba(95,217,201,0.15); border-color: var(--accent); }
  .switch input:checked + .slider-track::before { transform: translateX(16px); background: var(--accent); }

  .generate-btn {
    width: 100%;
    margin-top: 26px;
    background: var(--accent);
    color: #0D1512;
    border: none;
    border-radius: var(--radius);
    padding: 15px 0;
    font-weight: 600;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.08s ease;
  }
  .generate-btn:hover { opacity: 0.92; }
  .generate-btn:active { transform: scale(0.98); }

  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--surface-2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <p class="kicker">03 / password generator</p>
      <h1>Keyforge</h1>
      <p class="sub">Generate a random password. Everything happens in your browser — nothing is sent anywhere.</p>
    </header>

    <div class="output">
      <div id="passwordText">correct-horse</div>
      <button class="icon-btn" id="regenBtn" aria-label="Regenerate" title="Regenerate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="copyBtn" aria-label="Copy" title="Copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>

    <div class="strength-row">
      <div class="strength-bars">
        <span id="bar1"></span><span id="bar2"></span><span id="bar3"></span><span id="bar4"></span>
      </div>
      <span class="strength-label" id="strengthLabel">—</span>
    </div>

    <div class="field">
      <div class="field-label"><span>Length</span><span class="val" id="lengthVal">14</span></div>
      <input type="range" id="lengthSlider" min="4" max="32" value="14">
    </div>

    <div class="toggles">
      <div class="toggle-row">
        <label for="upper">Uppercase letters</label>
        <span class="example">A–Z</span>
        <label class="switch"><input type="checkbox" id="upper" checked><span class="slider-track"></span></label>
      </div>
      <div class="toggle-row">
        <label for="lower">Lowercase letters</label>
        <span class="example">a–z</span>
        <label class="switch"><input type="checkbox" id="lower" checked><span class="slider-track"></span></label>
      </div>
      <div class="toggle-row">
        <label for="numbers">Numbers</label>
        <span class="example">0–9</span>
        <label class="switch"><input type="checkbox" id="numbers" checked><span class="slider-track"></span></label>
      </div>
      <div class="toggle-row">
        <label for="symbols">Symbols</label>
        <span class="example">!@#$</span>
        <label class="switch"><input type="checkbox" id="symbols"><span class="slider-track"></span></label>
      </div>
    </div>

    <button class="generate-btn" id="generateBtn">Generate password</button>
  </div>

  <div class="toast" id="toast">Copied to clipboard</div>

<script>
  const LOWER = 'abcdefghijklmnopqrstuvwxyz';
  const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const NUMBERS = '0123456789';
  const SYMBOLS = '!@#$%^&*()_-+=?';

  const lengthSlider = document.getElementById('lengthSlider');
  const lengthVal = document.getElementById('lengthVal');
  const upper = document.getElementById('upper');
  const lower = document.getElementById('lower');
  const numbers = document.getElementById('numbers');
  const symbols = document.getElementById('symbols');
  const passwordText = document.getElementById('passwordText');

  function randomChar(pool) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return pool[arr[0] % pool.length];
  }

  function buildPool() {
    let pool = '';
    if (lower.checked) pool += LOWER;
    if (upper.checked) pool += UPPER;
    if (numbers.checked) pool += NUMBERS;
    if (symbols.checked) pool += SYMBOLS;
    return pool;
  }

  function generate() {
    const length = Number(lengthSlider.value);
    const pool = buildPool();

    if (!pool) {
      passwordText.textContent = 'Select at least one option';
      updateStrength(0);
      return;
    }

    let pass = '';
    for (let i = 0; i < length; i++) pass += randomChar(pool);
    passwordText.textContent = pass;

    let checks = 0;
    if (lower.checked) checks++;
    if (upper.checked) checks++;
    if (numbers.checked) checks++;
    if (symbols.checked) checks++;
    const score = Math.min(4, Math.round((length / 32) * 2) + Math.floor(checks / 1.4));
    updateStrength(score);
  }

  function updateStrength(score) {
    const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3'), document.getElementById('bar4')];
    const labels = ['Too weak', 'Weak', 'Okay', 'Strong', 'Very strong'];
    const colors = ['var(--weak)', 'var(--weak)', 'var(--mid)', 'var(--strong)', 'var(--strong)'];
    bars.forEach((b, i) => {
      b.style.background = i < score ? colors[score] : 'var(--border)';
    });
    document.getElementById('strengthLabel').textContent = labels[score] || '—';
  }

  lengthSlider.addEventListener('input', () => {
    lengthVal.textContent = lengthSlider.value;
    generate();
  });
  [upper, lower, numbers, symbols].forEach(el => el.addEventListener('change', generate));
  document.getElementById('generateBtn').addEventListener('click', generate);
  document.getElementById('regenBtn').addEventListener('click', generate);

  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(passwordText.textContent);
    } catch (e) {
      const range = document.createRange();
      range.selectNode(passwordText);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
    }
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1400);
  });

  generate();
</script>
</body>
</html>
