<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Throwdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12151A;
    --surface: #1B1F26;
    --surface-2: #232833;
    --border: #2C323D;
    --text: #E9E9EA;
    --text-dim: #8D93A0;
    --accent: #5FD9C9;
    --win: #5FD9C9;
    --lose: #E8664A;
    --tie: #E0B44A;
    --radius: 12px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 50% 0%, rgba(95,217,201,0.08), transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
  }
  .app { width: 100%; max-width: 480px; }
  header { margin-bottom: 24px; text-align: center; }
  .kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    margin: 0 0 8px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub { color: var(--text-dim); font-size: 14px; margin: 0; }

  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin: 26px 0;
  }
  .score-block { text-align: center; }
  .score-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .score-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 700;
    margin-top: 2px;
  }
  .vs { color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .ties { text-align: center; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-top: -14px; margin-bottom: 20px; }

  .arena {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 8px;
    min-height: 96px;
  }
  .hand {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), border-color 0.2s ease;
  }
  .hand.shaking { animation: shake 0.35s ease infinite; }
  @keyframes shake {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-6px) rotate(-4deg); }
  }
  .hand.win { border-color: var(--win); box-shadow: 0 0 0 3px rgba(95,217,201,0.15); }
  .hand.lose { border-color: var(--lose); opacity: 0.55; }
  .hand.tie { border-color: var(--tie); }
  .versus-label { color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 13px; }

  .result-line {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text-dim);
    min-height: 20px;
    margin: 10px 0 26px;
  }
  .result-line.win { color: var(--win); }
  .result-line.lose { color: var(--lose); }
  .result-line.tie { color: var(--tie); }

  .choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .choice-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 0 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s ease, transform 0.08s ease;
  }
  .choice-btn:hover { border-color: var(--accent); }
  .choice-btn:active { transform: scale(0.96); }
  .choice-btn .emoji { font-size: 32px; }
  .choice-btn .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    text-transform: capitalize;
  }

  .reset-row { text-align: center; margin-top: 22px; }
  .reset-row button {
    background: none;
    border: none;
    color: var(--text-dim);
    text-decoration: underline;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .reset-row button:hover { color: var(--text); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <p class="kicker">04 / rock · paper · scissors</p>
      <h1>Throwdown</h1>
      <p class="sub">Pick a hand. The computer picks its own, instantly.</p>
    </header>

    <div class="scoreboard">
      <div class="score-block">
        <div class="score-label">You</div>
        <div class="score-num" id="userScore">0</div>
      </div>
      <div class="vs">vs</div>
      <div class="score-block">
        <div class="score-label">Computer</div>
        <div class="score-num" id="computerScore">0</div>
      </div>
    </div>
    <div class="ties">Ties: <span id="ties">0</span></div>

    <div class="arena">
      <div class="hand" id="userHand">✊</div>
      <div class="versus-label">—</div>
      <div class="hand" id="computerHand">✊</div>
    </div>
    <div class="result-line" id="resultLine">Make your move.</div>

    <div class="choices">
      <button class="choice-btn" data-choice="rock">
        <span class="emoji">✊</span><span class="label">Rock</span>
      </button>
      <button class="choice-btn" data-choice="paper">
        <span class="emoji">✋</span><span class="label">Paper</span>
      </button>
      <button class="choice-btn" data-choice="scissors">
        <span class="emoji">✌️</span><span class="label">Scissors</span>
      </button>
    </div>

    <div class="reset-row"><button id="resetBtn">Reset score</button></div>
  </div>

<script>
  const EMOJI = { rock: '✊', paper: '✋', scissors: '✌️' };
  const BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };

  let userScore = 0, computerScore = 0, ties = 0;

  const userHand = document.getElementById('userHand');
  const computerHand = document.getElementById('computerHand');
  const resultLine = document.getElementById('resultLine');

  function play(userChoice) {
    userHand.classList.add('shaking');
    computerHand.classList.add('shaking');
    resultLine.className = 'result-line';
    resultLine.textContent = 'Choosing…';

    setTimeout(() => {
      const computerChoice = ['rock', 'paper', 'scissors'][Math.floor(Math.random() * 3)];

      userHand.classList.remove('shaking', 'win', 'lose', 'tie');
      computerHand.classList.remove('shaking', 'win', 'lose', 'tie');
      userHand.textContent = EMOJI[userChoice];
      computerHand.textContent = EMOJI[computerChoice];

      let outcome;
      if (userChoice === computerChoice) {
        outcome = 'tie';
        ties++;
        resultLine.textContent = `Both picked ${userChoice} — it's a tie.`;
      } else if (BEATS[userChoice] === computerChoice) {
        outcome = 'win';
        userScore++;
        resultLine.textContent = `${cap(userChoice)} beats ${computerChoice} — you win!`;
      } else {
        outcome = 'lose';
        computerScore++;
        resultLine.textContent = `${cap(computerChoice)} beats ${userChoice} — computer wins.`;
      }

      userHand.classList.add(outcome === 'win' ? 'win' : outcome === 'lose' ? 'lose' : 'tie');
      computerHand.classList.add(outcome === 'lose' ? 'win' : outcome === 'win' ? 'lose' : 'tie');
      resultLine.classList.add(outcome);

      document.getElementById('userScore').textContent = userScore;
      document.getElementById('computerScore').textContent = computerScore;
      document.getElementById('ties').textContent = ties;
    }, 450);
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => play(btn.dataset.choice));
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    userScore = 0; computerScore = 0; ties = 0;
    document.getElementById('userScore').textContent = 0;
    document.getElementById('computerScore').textContent = 0;
    document.getElementById('ties').textContent = 0;
    userHand.textContent = '✊'; computerHand.textContent = '✊';
    userHand.className = 'hand'; computerHand.className = 'hand';
    resultLine.className = 'result-line';
    resultLine.textContent = 'Make your move.';
  });
</script>
</body>
</html>
